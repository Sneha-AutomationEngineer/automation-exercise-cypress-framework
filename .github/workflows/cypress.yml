name: Cypress E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: 1
            command: npx cypress run --spec "cypress/e2e/ui/login.cy.js,cypress/e2e/ui/logout.cy.js,cypress/e2e/ui/registerUser.cy.js,cypress/e2e/ui/products.cy.js"
          - container: 2
            command: npx cypress run --spec "cypress/e2e/ui/searchProducts.cy.js,cypress/e2e/ui/addProducts.cy.js,cypress/e2e/ui/placeOrderLoginBeforeCheckout.cy.js,cypress/e2e/ui/verifyAddress.cy.js"
          - container: 3
            command: npm run test:api

    name: cypress-run (${{ matrix.container }})

    env:
      BASE_URL: https://automationexercise.com/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: ${{ matrix.command }}

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-mochawesome-report-${{ matrix.container }}
          path: cypress/reports
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.container }}
          path: cypress/screenshots
          if-no-files-found: ignore
