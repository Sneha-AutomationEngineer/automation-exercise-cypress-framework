name: Cypress E2E

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        containers: [1, 2, 3]

    env:
      BASE_URL: https://automationexercise.com/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: |
            if [ "${{ matrix.containers }}" = "1" ]; then
              npx cypress run --spec "cypress/e2e/ui/login.cy.js,cypress/e2e/ui/logout.cy.js,cypress/e2e/ui/registerUser.cy.js,cypress/e2e/ui/products.cy.js"
            elif [ "${{ matrix.containers }}" = "2" ]; then
              npx cypress run --spec "cypress/e2e/ui/searchProducts.cy.js,cypress/e2e/ui/addProducts.cy.js,cypress/e2e/ui/placeOrderLoginBeforeCheckout.cy.js,cypress/e2e/ui/verifyAddress.cy.js"
            else
              npx cypress run --spec "cypress/e2e/api/**/*.cy.js"
            fi

      - name: Upload Mochawesome report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-mochawesome-report-${{ matrix.containers }}
          path: cypress/reports
          if-no-files-found: ignore

      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.containers }}
          path: cypress/screenshots
          if-no-files-found: ignore
